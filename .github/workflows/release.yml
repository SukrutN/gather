name: Release

# Push a tag (v1.2.0) and CI builds, tests, packages, and publishes the
# Windows installer and portable exe to GitHub Releases. The app's
# auto-updater reads those releases; no other publishing step exists.
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build -w @gather/desktop
      - name: Prepare winCodeSign cache
        run: node scripts/prepare-win-codesign-cache.mjs
        working-directory: apps/desktop
      - name: Package and publish
        run: npx electron-builder --win --publish always
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
